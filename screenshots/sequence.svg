<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#0b1220"/>
  <text x="30" y="38" fill="#4cc9f0" font-family="Segoe UI" font-size="22" font-weight="bold">Sorting sequence and jam/E-stop priority</text>
  <g font-family="Segoe UI" font-size="13" fill="#e6edf7">
    <rect x="30" y="80" width="120" height="54" rx="8" fill="#111c2e" stroke="#4cc9f0"/><text x="53" y="112">PE1 detect</text>
    <rect x="190" y="80" width="120" height="54" rx="8" fill="#111c2e" stroke="#4cc9f0"/><text x="210" y="112">PE2 classify</text>
    <rect x="350" y="80" width="140" height="54" rx="8" fill="#111c2e" stroke="#ffd166"/><text x="366" y="112">Reject decision</text>
    <rect x="530" y="80" width="130" height="54" rx="8" fill="#111c2e" stroke="#ffd166"/><text x="548" y="112">Diverter 0.6 s</text>
    <rect x="700" y="80" width="150" height="54" rx="8" fill="#111c2e" stroke="#06d6a0"/><text x="724" y="112">Counters + exit</text>
  </g>
  <g stroke="#4cc9f0" stroke-width="2" fill="none">
    <path d="M150 107 H190"/><path d="M310 107 H350"/><path d="M490 107 H530"/><path d="M660 107 H700"/>
  </g>
  <rect x="30" y="180" width="820" height="70" rx="8" fill="#1a1020" stroke="#ef476f"/>
  <text x="55" y="210" fill="#ef476f" font-family="Segoe UI" font-size="16" font-weight="bold">Highest priority</text>
  <text x="55" y="235" fill="#e6edf7" font-family="Segoe UI" font-size="14">E-stop or jam &gt; motor off &gt; latched alarm &gt; reset only when condition clears</text>
</svg>
